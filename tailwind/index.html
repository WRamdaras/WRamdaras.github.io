<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio Wiresh Ramdaras</title>
    <link rel="stylesheet" href="css/tailwind.css" />
    <script defer src="js/tailwind.js"></script>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
</head>

<body class="">

    <!-- Navbar -->
    <nav class="bg-[#F2F0EF] sticky top-0">
        <div class="max-w-screen-xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <a href="#" class="flex-shrink-0 flex items-center">
                    <p class="text-xl font-bold text-[#550000]">WR</p>
                </a>

                <!-- Desktop Navigation -->
                <div class="hidden sm:flex items-center justify-center w-full">
                    <ul class="flex space-x-8">
                        <li><a href="#" class="py-2 px-3 text-lg hover:text-[#550000] hover:font-bold">Home</a></li>
                        <li><a href="#" class="py-2 px-3 text-lg hover:text-[#550000] hover:font-bold">About me</a></li>
                        <li><a href="#" class="py-2 px-3 text-lg hover:text-[#550000] hover:font-bold">Projects</a></li>
                        <li><a href="#" class="py-2 px-3 text-lg hover:text-[#550000] hover:font-bold">Contact</a></li>
                    </ul>
                </div>

                <!-- Hamburger Button -->
                <div class="sm:hidden">
                    <button id="menu-toggle" class="p-2 rounded-md focus:outline-none text-[#550000]">
                        <svg id="menu-icon" class="h-6 w-6" stroke="currentColor" fill="none" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                        <svg id="close-icon" class="h-6 w-6 hidden" stroke="currentColor" fill="none" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Mobile Menu -->
            <div id="mobile-menu" class="hidden sm:hidden bg-[#F2F0EF] p-4 space-y-2">
                <a href="#" class="block">Home</a>
                <a href="#" class="block">About me</a>
                <a href="#" class="block">Projects</a>
                <a href="#" class="block">Contact</a>
            </div>
        </div>
    </nav>
    
    <!-- Home -->

    <div class="relative w-[300px] sm:w-[400px]">
        <!-- Profile Image -->
        <div class="relative flex justify-center">
            <img src="test.jpg" alt="Profile" class="w-[120px] h-[120px] sm:w-[150px] sm:h-[150px] rounded-full object-cover border-4 border-white shadow-lg absolute top-[-50px]">
        </div>

        <!-- Red Card -->
        <div class="w-full h-[200px] bg-[#550000] rounded-tl-[50px] rounded-tr-[50px] shadow-md flex flex-col items-center justify-end pb-8">
            <!-- Name (on top of the image) -->
            <p class="absolute top-[-20px] text-white text-lg sm:text-xl font-bold px-4 py-1 rounded-md shadow-md">Name Name</p>
        </div>
    </div>
    <!-- About me -->

    <!-- Projects -->

    <!-- Contact -->

</body>

</html>
